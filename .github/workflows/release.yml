name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version tag (for example: v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out main with tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate version and release target
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Releases must be dispatched from $DEFAULT_BRANCH, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi


          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH without leading zeroes: $VERSION" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( major > 999 || minor > 999 || patch > 999 )); then
            echo "Each version component must be between 0 and 999: $VERSION" >&2
            exit 1
          fi

          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is outside 1..2100000000: $version_code" >&2
            exit 1
          fi

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION"
            tagged_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $VERSION already points to $tagged_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
            tag_exists=true
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists: $VERSION" >&2
            exit 1
          fi

          {
            echo "version_name=${VERSION#v}"
            echo "version_code=$version_code"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/baoxiaoguanli-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test assembleRelease \
            -PreleaseVersionName="${{ steps.version.outputs.version_name }}" \
            -PreleaseVersionCode="${{ steps.version.outputs.version_code }}" \
            --console=plain

      - name: Verify and prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          source_apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$source_apk" ]]; then
            echo "Signed release APK not found: $source_apk" >&2
            exit 1
          fi

          build_tools_dir="$(dirname "$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)")"
          apksigner="$build_tools_dir/apksigner"
          aapt="$build_tools_dir/aapt"

          [[ -x "$apksigner" ]] || { echo "apksigner not found" >&2; exit 1; }
          [[ -x "$aapt" ]] || { echo "aapt not found" >&2; exit 1; }

          "$apksigner" verify --verbose --print-certs "$source_apk"

          badging="$($aapt dump badging "$source_apk" | sed -n '1p')"
          expected_version_name="versionName='${{ steps.version.outputs.version_name }}'"
          expected_version_code="versionCode='${{ steps.version.outputs.version_code }}'"
          [[ "$badging" == *"$expected_version_name"* ]] || {
            echo "APK versionName mismatch: $badging" >&2
            exit 1
          }
          [[ "$badging" == *"$expected_version_code"* ]] || {
            echo "APK versionCode mismatch: $badging" >&2
            exit 1
          }

          mkdir -p release-assets
          apk_name="baoxiaoguanli-$VERSION.apk"
          cp "$source_apk" "release-assets/$apk_name"
          (
            cd release-assets
            sha256sum "$apk_name" > "$apk_name.sha256"
          )

      - name: Create annotated tag
        if: steps.version.outputs.tag_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$VERSION" "$GITHUB_SHA" --message "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/baoxiaoguanli-release.jks"
